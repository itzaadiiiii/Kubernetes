name: Build & Scan

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: docker build -t myregistry.example.com/myapp:${{ github.sha }} .

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: myregistry.example.com/myapp:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 1   # Fail build if CRITICAL/HIGH found

      - name: Push to Registry
        if: success()
        run: docker push myregistry.example.com/myapp:${{ github.sha }}
