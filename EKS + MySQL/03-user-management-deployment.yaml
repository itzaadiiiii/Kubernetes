apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-management
  namespace: user-mgmt
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-management
  template:
    metadata:
      labels:
        app: user-management
    spec:
      containers:
        - name: user-management
          # Replace with your actual image URI and tag.
          image: YOUR_ACCOUNT.dkr.ecr.us-east-1.amazonaws.com/user-management:REPLACE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: userMGMT
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: user-mgmt-db-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: user-mgmt-db-credentials
                  key: password
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
